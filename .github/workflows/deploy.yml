name: CI-CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - "lab06-cicd/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "lab06-cicd/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------
  # STAGE 1 - CONTINUOUS INTEGRATION (three parallel gates)
  # ---------------------------------------------------------------
  lint:
    name: CI - Lint
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: lab06-cicd
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: lab06-cicd/package-lock.json
      - name: Install dependencies (deterministic)
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  test:
    name: CI - Unit Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: lab06-cicd
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: lab06-cicd/package-lock.json
      - name: Install dependencies (deterministic)
        run: npm ci
      - name: Run unit tests
        run: npm test

  audit:
    name: CI - Dependency Security Audit
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: lab06-cicd
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: lab06-cicd/package-lock.json
      - name: Install dependencies (deterministic)
        run: npm ci
      - name: Dependency vulnerability audit (high and above)
        run: npm audit --audit-level=high --omit=dev

  # ---------------------------------------------------------------
  # STAGE 2 - CONTAINERIZATION (build, scan, push to GHCR)
  # ---------------------------------------------------------------
  package:
    name: CD - Build, Scan and Push Image
    needs: [lint, test, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Compute image coordinates
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/lab06-cicd" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image locally (not pushed yet)
        uses: docker/build-push-action@v5
        with:
          context: ./lab06-cicd
          file: ./lab06-cicd/Dockerfile
          load: true
          push: false
          tags: ${{ steps.vars.outputs.image }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container vulnerability scan (Trivy, CRITICAL blocks)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.image }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push image to GHCR (tags - full SHA and latest)
        uses: docker/build-push-action@v5
        with:
          context: ./lab06-cicd
          file: ./lab06-cicd/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ github.sha }}
            ${{ steps.vars.outputs.image }}:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha

  # ---------------------------------------------------------------
  # STAGE 3 - CONTINUOUS DEPLOYMENT (webhook + health polling)
  # ---------------------------------------------------------------
  deploy:
    name: CD - Deploy to Render
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.PUBLIC_APP_URL }}
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_REF: ${{ needs.package.outputs.image }}:${{ github.sha }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl --silent --show-error --output /dev/null \
            --write-out "%{http_code}" --max-time 30 \
            --retry 3 --retry-delay 5 \
            "${RENDER_DEPLOY_HOOK_URL}")
          echo "Deploy hook HTTP status: ${HTTP_CODE}"
          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error title=Deploy hook rejected::HTTP ${HTTP_CODE}"
            exit 1
          fi
      - name: Poll until the new commit is live and healthy
        env:
          APP_URL: ${{ vars.PUBLIC_APP_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          for attempt in $(seq 1 24); do
            BODY=$(curl --silent --max-time 10 "${APP_URL}/api/status" || true)
            LIVE=$(echo "${BODY}" | jq -r '.commit // empty' 2>/dev/null || true)
            echo "attempt ${attempt}/24 live_commit=${LIVE:-unreachable}"
            if [ "${LIVE}" = "${EXPECTED_SHA}" ]; then
              curl --fail --silent --max-time 10 "${APP_URL}/healthz"
              echo
              echo "### Deployed ${EXPECTED_SHA}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error title=Deployment not healthy::commit ${EXPECTED_SHA} not live after 6 minutes"
          exit 1
